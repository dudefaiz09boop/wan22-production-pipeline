[project]
name = "wan22-production-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=11.0",
    "edge-tts==7.3.1",
    "requests>=2.31",
    "huggingface-hub>=0.23",
    "tqdm>=4.66",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "insightface>=0.7",
    "onnxruntime-gpu>=1.18",
    "diffusers>=0.30",
    "transformers>=4.41",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "torch>=2.3",
    "torchvision>=0.18",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false
