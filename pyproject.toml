[project]
name = "wan22-production-pipeline"
version = "0.1.0"
# onnxruntime-gpu ships wheels for cp311-cp314 only. Python 3.15 has no wheel,
# so cap the interpreter below 3.15.
requires-python = ">=3.11,<3.15"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=11.0",
    "edge-tts==7.3.1",
    "requests>=2.31",
    "huggingface-hub>=0.23",
    "tqdm>=4.66",
    "numpy>=1.24,<1.26",
    "opencv-python-headless>=4.10",
    "insightface>=0.7",
    "onnxruntime-gpu>=1.18",
    "diffusers>=0.30",
    "accelerate>=0.30",
    # diffusers' load_lora_weights() requires the PEFT backend.
    "peft>=0.11",
    "safetensors>=0.4",
    "torch==2.6.0",
    "torchvision==0.21.0",
    # Chatterbox Multilingual: Hindi TTS with voice cloning and emotion
    # control. 0.1.4 is the last release pinning transformers 4.x; 0.1.7
    # forces transformers==5.2.0, which breaks its own LlamaModel import.
    "chatterbox-tts==0.1.4",
    "torchaudio==2.6.0",
    # perth (chatterbox watermarker) imports pkg_resources, which setuptools
    # 81+ removed.
    "setuptools<81",
    "transformers==4.46.3",
]

# The AIC Cloud PyTorch image ships an NVIDIA driver that supports CUDA 12.6.
# PyPI's default torch wheel is built for CUDA 13 and fails at import with
# "NVIDIA driver on your system is too old". Pin the CUDA 12.6 index so
# `uv sync` never silently replaces the working build.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false
